name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Build Cloudflare Worker
        run: bun run build:worker

      - name: Verify build output
        run: |
          if [ ! -f ".vercel/output/static/_worker.js/index.js" ]; then
            echo "Worker bundle not found"
            exit 1
          fi
          echo "Worker bundle created successfully"
          if [ ! -d ".vercel/output/functions/api" ]; then
            echo "API functions not generated"
            exit 1
          fi
          echo "API functions generated successfully"
