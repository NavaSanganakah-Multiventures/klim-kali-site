name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Commit regenerated lockfile (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git diff --cached --quiet || (git commit -m "chore: regenerate bun.lock for @opennextjs/cloudflare" && git push)

      - name: Run ESLint
        run: bun run lint

      - name: Build Cloudflare Worker (OpenNext)
        run: bun run build:worker

      - name: Verify build output
        run: |
          if [ ! -f ".open-next/worker.js" ]; then
            echo "Worker bundle not found"
            exit 1
          fi
          echo "Worker bundle created successfully"
          if [ ! -d ".open-next/assets" ]; then
            echo "Static assets not generated"
            exit 1
          fi
          echo "Static assets generated successfully"
