name = "klim-kali-site"
compatibility_date = "2026-08-16"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
keep_vars = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Production Environment
[env.production]
name = "kali-mata-mandir-prod"

# D1 Database for Production
[[env.production.d1_databases]]
binding = "DB"
database_name = "kali-mata-prod-db"
database_id = "PROD_D1_ID_HERE"
migrations_dir = "db_migrations"

# Send Email Binding for Production
[[env.production.send_email]]
name = "SEB"

# R2 Bucket for Production
[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "kali-mata-prod-storage"

# KV Namespace for Secrets/Config
[[env.production.kv_namespaces]]
binding = "CONFIG"
id = "PROD_KV_ID_HERE"
