name = "kali-mata-mandir"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]
main = ".worker-next/index.mjs"

[assets]
directory = ".worker-next/assets"
binding = "ASSETS"

[build]
command = "npm run build:worker"

# Production Environment
[env.production]
name = "kali-mata-mandir-prod"
# D1 Database for Production
[[env.production.d1_databases]]
binding = "DB"
database_name = "kali-mata-prod-db"
database_id = "PROD_D1_ID_HERE"

# R2 Bucket for Production
[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "kali-mata-prod-storage"

# KV Namespace for Secrets/Config
[[env.production.kv_namespaces]]
binding = "CONFIG"
id = "PROD_KV_ID_HERE"


# Preview / Development Environment
[env.preview]
name = "kali-mata-mandir-preview"
# D1 Database for Preview
[[env.preview.d1_databases]]
binding = "DB"
database_name = "kali-mata-preview-db"
database_id = "PREVIEW_D1_ID_HERE"

# R2 Bucket for Preview
[[env.preview.r2_buckets]]
binding = "STORAGE"
bucket_name = "kali-mata-preview-storage"

# KV Namespace for Secrets/Config
[[env.preview.kv_namespaces]]
binding = "CONFIG"
id = "PREVIEW_KV_ID_HERE"
